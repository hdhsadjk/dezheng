<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2457a6">
<title>得正｜活動圖片頁</title>
<style>
:root{--blue:#2457a6;--blue2:#173f83;--cream:#f3eee5;--ink:#192b47}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#e8edf5,#f5f0e8 55%,#dce7f6);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
header{background:var(--blue);color:#fff;text-align:center;padding:24px 16px 20px;box-shadow:0 5px 18px #173f8326}
.brand{font-size:clamp(25px,5vw,38px);font-weight:800;letter-spacing:.16em}
.sub{font-size:13px;letter-spacing:.06em;margin-top:5px;opacity:.95}
.notice{max-width:900px;margin:16px auto 0;padding:10px 14px;border:1px solid #d6b77b;background:#fff8e8;border-radius:10px;color:#664a19;font-size:13px;line-height:1.6}
main{width:min(940px,calc(100% - 24px));margin:22px auto 40px}
.panel{background:#fff;border-radius:18px;overflow:hidden;margin:0 0 22px;box-shadow:0 12px 30px #183b6c17;border:1px solid #e4e9f1}
.panel img{display:block;width:100%;height:auto}
.claim-wrap{padding:0;position:relative}
.claim-link{display:block;position:relative;text-decoration:none;color:inherit}
.claim-link img{width:100%}
.claim-link:focus-visible{outline:4px solid #f4c400;outline-offset:3px}
.cta{display:block;margin:0;padding:16px 20px;text-align:center;background:#f6d400;color:#111;font-weight:800;font-size:22px;letter-spacing:.08em}
.hint{text-align:center;font-size:13px;color:#52627a;padding:0 16px 18px}
footer{text-align:center;padding:0 16px 30px;color:#5b6880;font-size:12px;line-height:1.7}
@media(min-width:700px){main{margin-top:28px}.panel{margin-bottom:26px}}
</style>
</head>
<body>
<header>
  <div class="brand">得正</div>
  <div class="sub">OOLONG TEA PROJECT · 活動圖片展示頁</div>
</header>
<div class="notice">非官方自製活動頁，未經品牌官方授權或認證；本頁不代表得正官方。優惠內容及可用性請以品牌官方公告為準。</div>
<main>
  <section class="panel"><img src="drink-photo-1.png" alt="飲品圖片一"></section>
  <section class="panel"><img src="drink-photo-2.png" alt="飲品圖片二"></section>
  <section class="panel claim-wrap">
    <a class="claim-link" href="https://lin.ee/rhk0l8g" target="_blank" rel="noopener noreferrer" aria-label="前往外部 LINE 連結">
      <img src="claim-section.png" alt="活動圖片；點擊前往外部 LINE 連結">
      <span class="cta">點擊前往 LINE</span>
    </a>
    <div class="hint">點擊上方圖片或按鈕會開啟外部 LINE 連結。</div>
  </section>
  <section class="panel"><img src="menu.png" alt="得正飲品菜單圖片"></section>
</main>
<footer>此頁為自製圖片展示與連結頁，並非品牌官方網站；頁面未提供或暗示官方藍勾認證。</footer>
</body>
</html>
